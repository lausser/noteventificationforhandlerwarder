# This workflow installs Python dependencies and runs tests across a matrix of
# Python versions, and runs the focused correctness lint gate on Python 3.12.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package omdnotificationforwarder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-notificationforwarder:

    # nicht ubuntu-latest, weil da mindestens py3.6 fehlt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./notificationforwarder
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12.0", "3.14.5"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # install deps from pyproject.toml
        python -m pip install .
    - name: Install test dependencies
      run: |
        python -m pip install .[test]
    - name: Test with pytest
      run: |
        pytest
    - name: Setup tmate session
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
      with:
        limit-access-to-actor: true

  lint-notificationforwarder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./notificationforwarder
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.12
      uses: actions/setup-python@v5.6.0
      with:
        python-version: "3.12"
    - name: Install flake8 7.5.0
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8==7.5.0
    - name: Lint with flake8
      run: |
        python -m flake8 --version
        python -m flake8 --config .flake8 src/notificationforwarder --count --statistics

